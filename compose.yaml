# Valeurs fictives de démonstration : ne jamais y mettre de vrai secret.
services:
  vault:
    image: hashicorp/vault:1.20
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: devstation-demo
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.20
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: devstation-demo
    volumes:
      - ./vault/init.sh:/init.sh:ro
    command: ["sh", "/init.sh"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_ENABLED: "true"
      SPRING_CLOUD_VAULT_URI: http://vault:8200
      SPRING_CLOUD_VAULT_TOKEN: devstation-demo
      SPRING_CONFIG_IMPORT: vault://
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ../demo-frontend
      dockerfile: Containerfile
    depends_on:
      - backend
    ports:
      - "8080:8080"